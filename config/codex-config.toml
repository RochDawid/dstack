# Paste at the top of ~/.codex/config.toml (before the first [table]), replacing any existing copies of these keys.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Merge into the existing [tui] table.
[tui]
status_line = ["model-with-reasoning", "current-dir", "thread-name", "git-branch", "pull-request-number", "context-used", "context-window-size"]
status_line_use_colors = true
