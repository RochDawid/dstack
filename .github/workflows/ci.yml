name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse and pass shellcheck
        run: shellcheck install.sh config/statusline.sh

      - name: Every skill has a SKILL.md with name and description
        run: |
          bad=0
          for d in skills/*/; do
            f="$d/SKILL.md"
            if ! head -1 "$f" 2>/dev/null | grep -q '^---$' || ! grep -q '^name:' "$f" || ! grep -q '^description:' "$f"; then
              echo "::error file=$f::missing SKILL.md or its name/description frontmatter"; bad=1
            fi
          done
          exit $bad

      - name: Statusline renders sample input
        run: |
          out=$(echo '{"model":{"display_name":"Opus"},"cwd":"/tmp","context_window":{"context_window_size":200000,"used_percentage":42},"cost":{"total_cost_usd":1.234}}' | config/statusline.sh)
          echo "$out"
          for want in Opus 42% 200K '$1.23'; do grep -qF "$want" <<<"$out" || { echo "::error::statusline is missing $want"; exit 1; }; done
